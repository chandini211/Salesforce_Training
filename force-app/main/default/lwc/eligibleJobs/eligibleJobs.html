<template>
    <lightning-card title="Eligible Jobs" icon-name="standard:job_profile">

        <template if:true={hasJobs}>
            <div class="slds-p-around_medium">

                <template for:each={jobs} for:item="job">
                    <div key={job.Id} class="slds-box slds-m-bottom_small">

                        <h2 class="slds-text-heading_medium">
                            {job.Name}
                        </h2>

                        <p>
                            <strong>Minimum CGPA:</strong>
                            {job.Minimum_CGPA__c}
                        </p>

                        <p>
                            <strong>Deadline:</strong>
                            {job.Deadline__c}
                        </p>

                        <p>
                            <strong>Eligible Branch:</strong>
                            {job.Eligible_Branch__c}

                        </p>
                        <lightning-button
                             label="Apply"
                             variant="brand"
                            data-id={job.Id}
                             onclick={handleApply}>
                        </lightning-button>

                    </div>
                </template>

            </div>
        </template>

        <template if:false={hasJobs}>
            <div class="slds-p-around_medium">
                <p>No eligible jobs found.</p>
            </div>
        </template>

    </lightning-card>
</template>
